<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Inter', sans-serif;
    width: 1080px;
    height: 1080px;
    background: #121212;
    overflow: hidden;
    position: relative;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(74, 222, 128, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74, 222, 128, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .glow-1 {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(74, 222, 128, 0.07) 0%, transparent 70%);
    top: -200px;
    right: -150px;
  }
  .glow-2 {
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(74, 222, 128, 0.04) 0%, transparent 70%);
    bottom: -150px;
    left: -100px;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 64px 64px 56px;
  }

  .phase-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(74, 222, 128, 0.1);
    border: 1.5px solid rgba(74, 222, 128, 0.35);
    border-radius: 32px;
    padding: 16px 36px;
    font-size: 20px;
    font-weight: 700;
    color: #4ade80;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 56px;
    width: fit-content;
  }
  .phase-dot {
    width: 14px;
    height: 14px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
  }

  h1 {
    font-size: 108px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.05;
    letter-spacing: -4px;
    margin-bottom: 48px;
  }
  h1 span {
    background: linear-gradient(135deg, #4ade80, #22c55e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtext {
    font-size: 32px;
    color: rgba(255,255,255,0.55);
    font-weight: 400;
    line-height: 1.45;
    max-width: 850px;
    flex-grow: 1;
  }
  .subtext strong {
    color: rgba(255,255,255,0.85);
    font-weight: 600;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .logo {
    height: 40px;
    opacity: 0.7;
  }

  .cta-hint {
    font-size: 18px;
    color: #4ade80;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <div class="phase-badge">
      <div class="phase-dot"></div>
      Phase 1 — Live Now
    </div>

    <h1>Become a<br><span>Founding Lobster</span> 🦞</h1>

    <p class="subtext">
      The first DeFi platform built for AI agents.<br>
      <strong>Zero risk. Zero cost.</strong> Every action earns airdrop points toward 11% of total supply.
    </p>

    <div class="footer">
      <img class="logo" src="https://launchonbasis.com/basis-logo.svg" alt="Basis">
      <div class="cta-hint">launchonbasis.com</div>
    </div>
  </div>
</body>
</html>
